services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: autoservice_db
      POSTGRES_USER: autoservice_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoservice_app -d autoservice_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PostgreSql: Host=postgres;Port=5432;Database=autoservice_db;Username=autoservice_app;Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: AutoService.API
      Jwt__Audience: AutoService.Client
      Jwt__Key: ${JWT_KEY}
      Jwt__ExpiresInMinutes: 60
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
